<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>BugSynth</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" as="image" href="assets/key-pressed.webp">
</head>
<body>
  <main class="device">
    <header class="top">
      <h1>BugSynth</h1>
      <span class="proto">прототип</span>
    </header>

    <section class="sticker" aria-label="Жук">
      <div id="bug-art" class="art"></div>
      <div class="label">
        <span id="bug-code" class="code"></span>
        <strong id="bug-latin"></strong>
        <span id="bug-ru"></span>
      </div>
    </section>

    <div id="pads" class="pads" aria-label="Ноты"></div>
    <p id="status" class="status">Нажми на пад, чтобы включить звук. На компьютере играют клавиши A S D F G H J K.</p>

    <div class="octave">
      <button id="oct-down" type="button" aria-label="Октава вниз">−</button>
      <span>октава <b id="oct-label">0</b></span>
      <button id="oct-up" type="button" aria-label="Октава вверх">+</button>
    </div>

    <section class="block">
      <h2>Жуки</h2>
      <div id="shelf" class="shelf"></div>
    </section>

    <section class="block">
      <h2>Скрещивание</h2>
      <div class="breed">
        <label>Родитель A <select id="parent-a"></select></label>
        <label>Родитель B <select id="parent-b"></select></label>
      </div>
      <button id="breed" class="primary" type="button">Скрестить</button>
      <div class="row">
        <button id="compare" type="button" hidden>Сравнить с родителями</button>
        <button id="reset" type="button" hidden>Убрать гибридов</button>
      </div>
    </section>

    <section class="card">
      <p id="bug-fact"></p>
      <h2>Геном</h2>
      <div id="genes" class="genes"></div>
      <p id="gene-legend" class="legend" hidden>Метки на полосках: A и B — значения родителей.</p>
      <p class="warn">Визуальный стиль — бодихоррор: мокрая плоть, мутации, насекомые. Чем больше мутаций у гибрида, тем грязнее звук.</p>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
